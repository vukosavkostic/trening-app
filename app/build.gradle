plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
}

// Lokalni test sa pravim Notionom: NOTION_TOKEN_FILE se prosledjuje samo ako je postavljen.
tasks.withType(Test).configureEach { if (System.getenv('NOTION_TOKEN_FILE')) environment 'NOTION_TOKEN_FILE', System.getenv('NOTION_TOKEN_FILE') }

android {
    namespace 'com.vukos.trening'
    compileSdk 34
    defaultConfig {
        applicationId 'com.vukos.trening'
        minSdk 28   // ImageDecoder (EXIF rotacija slika)
        targetSdk 34
        versionCode 9
        versionName '0.9'
    }
    // Release kljuc i lozinka su van repozitorijuma: ~/.gradle/gradle.properties
    // (TRENING_STORE_FILE, TRENING_STORE_PASSWORD). Bez njih se koristi debug kljuc.
    signingConfigs {
        release {
            if (project.hasProperty('TRENING_STORE_FILE')) {
                storeFile file(TRENING_STORE_FILE)
                storePassword TRENING_STORE_PASSWORD
                keyAlias 'trening'
                keyPassword TRENING_STORE_PASSWORD
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig project.hasProperty('TRENING_STORE_FILE') ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true; buildConfig true }
}

ksp { arg('room.schemaLocation', "$projectDir/schemas") }

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.09.03')
    implementation composeBom
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.navigation:navigation-compose:2.8.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'

    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'

    implementation 'io.coil-kt:coil-compose:2.7.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    // Skener barkoda (Google Play services, bez dozvole za kameru)
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
